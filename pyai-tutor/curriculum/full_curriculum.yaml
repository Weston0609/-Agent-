# 完整 8 学期课程树（由 curriculum.json 转换，权威源）
meta:
  title: Python & AI 架构师离线学习系统 · 完整课程知识图谱
  version: '1.0'
  pass_threshold: 0.75
  lesson_minutes: 40
  semester_unlock_rule: 学期 N 解锁条件：学期 N-1 所有单元考试 >= 75% 且 期末考 >= 75% 且 无挂起补强项
semesters:
- id: s1
